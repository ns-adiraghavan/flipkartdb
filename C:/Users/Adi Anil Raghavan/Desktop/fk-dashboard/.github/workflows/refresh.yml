name: Refresh dashboard data

# When the admin uploads a new Excel (committed to data/incoming/latest.xlsx),
# this regenerates the dashboard JSON with the real generate_json.py and
# COMMITS the result back into the repo (public/data/*.json).
#
# Two consumers of that commit, exactly like the TataCliq dashboard:
#   • Vercel  — auto-redeploys on the push and serves the fresh /data.
#   • EC2     — `git pull` (manual or a 1-min cron) picks it up; nginx serves /data.
on:
  push:
    branches: [main]
    paths:
      - "data/incoming/latest.xlsx"
  workflow_dispatch: {}

# Allow the built-in GITHUB_TOKEN to push the regenerated JSON back.
permissions:
  contents: write

# Prevent overlapping runs clobbering each other.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate JSON
        run: |
          if [ ! -f data/incoming/latest.xlsx ]; then
            echo "No Excel at data/incoming/latest.xlsx — nothing to do."
            exit 0
          fi
          EXCEL_PATH=data/incoming/latest.xlsx OUTPUT_DIR=public/data \
            python scripts/generate_json.py

      - name: Commit refreshed data back to the repo
        run: |
          git config user.name  "fk-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/*.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "auto: refresh dashboard data [skip ci]"
            git push
          fi
